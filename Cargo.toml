[package]
name = "copcat"
version = "0.4.1"
edition = "2024"
description = "A viewer for COPC LiDAR point clouds, local or streamed over HTTP"
repository = "https://github.com/UTAS-TerraLuma/copcat"
default-run = "copcat-viewer"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
copc-streaming = "0.2.0"
eframe = "0.36.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
# Already in the tree through eframe; decodes STAC thumbnails (src/app/thumbnails.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
pollster = "0.4"
raw-window-handle = "0.6"
rfd = "0.17"
# preserve_order keeps a settings file's keys where they were when one is saved.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
# No gzip: compressing an already-compressed LAZ range only adds work.
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Drives the real viewer headlessly in tests/ui_kittest.rs.
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe", "snapshot"] }
proptest = "1.12"
tempfile = "3.27"

[profile.dev.package."*"]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
