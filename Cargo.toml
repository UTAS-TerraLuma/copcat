[package]
name = "rust-copc-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
copc-streaming = "0.2.0"
eframe = "0.36.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
pollster = "0.4"
thiserror = "2.0.21"
# No gzip: compressing an already-compressed LAZ range only adds work.
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5.8"

[profile.dev.package."*"]
opt-level = 2
