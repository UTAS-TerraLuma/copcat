[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in. Most users don't have Rust, so
# not CARGO_HOME: $XDG_BIN_HOME if set, else ~/.local/bin (on Windows that's
# %USERPROFILE%\.local\bin). Both binaries go into the same folder.
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# Whether to install an updater program
install-updater = true
# Link the C runtime statically on Windows, so users don't need VCRUNTIME140.dll
# (this is dist's default; it's set here to make it explicit)
msvc-crt-static = true
# Don't run anything on pull requests; releases only build on version tags
pr-run-mode = "skip"

[dist.github-custom-runners]
# Build Linux on the older Ubuntu: an older glibc runs on more distros
x86_64-unknown-linux-gnu = "ubuntu-22.04"
